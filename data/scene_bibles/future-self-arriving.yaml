# Scene bible: future-self-arriving   (DRAFT — Sonali to tear apart)
# The wish is the AFTER, not the fireworks. Quiet solidity of HAVING done the hard thing.

archetype: future-self-arriving

trigger_phrases:
  - "imagine myself a year from now having done it"
  - "imagine my future self"
  - "imagine having finished the hard thing"
  - "imagine looking back having made it"
  - "imagine the version of me who already achieved it"
  - "imagine a decade from now, after I've done what I'm scared to start"

direction: case_a

scene:
  where: "A place that PROVES the hard thing is done — the desk after the book is finished, the rooms after the move, the morning after the milestone has settled from triumph into fact"
  when: "A future ordinary moment, after the achievement has cooled from celebration into simply true"
  who_else: "Maybe the people who are there because of what you did; maybe a chosen solitude"
  mood: "Not the fireworks of achieving — the quiet solidity of HAVING achieved. Earned ordinariness. The gnawing wish replaced by a settled quiet."

anchors:
  - "the specific object that proves it is done — the finished thing on a shelf, the key in your hand, your name where it wasn't before"
  - "the way the body carries the achievement now as plain fact, not fragile hope"
  - "a morning that is just a morning, because the hard thing is finally behind you"
  - "the absence of the old gnawing — the space where the wanting used to live"
  - "the ordinary texture of the after-life: a coffee, a doorway, a familiar light"
  - "a steadiness in the chest that wasn't there when you didn't yet know you'd make it"

beats:
  - description: "the body, after — how it stands and breathes differently having done the thing"
    function: "embody the arrived self before naming anything"
  - description: "the concrete proof — the object or place that says, plainly, it's real and done"
    function: "anchor the achievement in a thing, not a feeling"
  - description: "an ordinary moment in the after-life — the achievement metabolized into normal days"
    function: "the real wish: not the trophy, the peace on the far side of it"
  - description: "the memory of the doubt — the night you didn't know you'd make it — seen now from the other side"
    function: "contrast; the distance you traveled"
  - description: "the quiet where the wanting used to be"
    function: "the deepest payoff — the wish at rest"
  - description: "carrying one small certainty back: that you are the person who did this"
    function: "the identity shift made portable"

forbidden_specifics:
  - "Do NOT linger in the moment-of-triumph — the wish is the AFTER, the having-arrived"
  - "Do not make it generic 'success' — anchor hard to the specific achievement from intake"
  - "The payoff is internal — do not make other people's praise or applause the reward"

style_notes:
  - "Register is 'settled,' not 'triumphant.' Quiet solidity, not a victory lap."
  - "Pull the specific achievement and proof-object from intake; if vague, commit to a concrete one."
  - "CASE A: they ARE the future self, inhabiting that body — not watching a movie of it."
