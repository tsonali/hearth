# Scene bible: power-quiet   (DRAFT — Sonali to tear apart)
# Having a capability — used QUIETLY, not shown off. (photographic-memory,
# twelve-languages, instrument-overnight, smartest, most-charismatic.) The wish is
# the EFFORTLESSNESS — a thing that's hard for everyone else being easy for you,
# experienced from the inside, in an ordinary moment.

archetype: power-quiet

trigger_phrases:
  - "imagine having a photographic memory"
  - "imagine speaking twelve languages"
  - "imagine playing any instrument perfectly"
  - "imagine being the smartest person in the room"
  - "imagine being effortlessly charismatic"
  - "imagine having [a skill/capability] come easily"

direction: case_a

scene:
  where: "An ordinary moment where the capability simply IS — a page in front of you, a conversation, an instrument in your hands — no audience, no test"
  when: "Now, mid-use, unremarkable on the surface"
  who_else: "Maybe one other person; the capability isn't performed FOR anyone"
  mood: "Effortlessness. The quiet astonishment of a hard thing being easy from the inside — calm mastery, not showing off."

anchors:
  - "the specific moment the capability engages — the page read once and held, the words arriving in another language, the hands knowing the keys"
  - "the ABSENCE of the usual effort/strain where it would normally be"
  - "a faint interior astonishment — 'this is just how it works for me now'"
  - "the body relaxed precisely where it would normally tense (jaw, hands, brow)"
  - "the ordinary surroundings, indifferent — no spotlight on the gift"
  - "the next thing arriving before you reach for it"

beats:
  - description: "the ordinary moment, the capability about to be used, no fanfare"
    function: "establish the un-staged setting — this is daily life, not a demo"
  - description: "the instant the capability engages — the specific concrete moment it works"
    function: "embody the gift through one concrete use"
  - description: "the absence of the usual strain — where effort would be, there's none"
    function: "the core wish: effortlessness, felt as a subtraction"
  - description: "the quiet interior astonishment, then its fading into normal"
    function: "the pleasure of it, and the deeper pleasure of it being ordinary to you"
  - description: "the body relaxed where it would normally tense"
    function: "mastery in the body, not just the mind"
  - description: "the next thing arriving before you reach — the capability running ahead of you"
    function: "the sustained ease, not a one-off trick"

forbidden_specifics:
  - "NOT a performance for an audience — the capability is used quietly, for its own sake"
  - "Anchor to the SPECIFIC capability from intake (memory, language, instrument...) — don't generalize to 'being talented'"
  - "Not superiority over others — the feeling is internal ease, not winning a comparison"

style_notes:
  - "The signature is EFFORTLESSNESS felt as the ABSENCE of strain — write the missing effort, not just the result."
  - "Calm and quiet, not triumphant (that's achievement-moment). Mastery is understated."
  - "Use ONE concrete instance of the capability working, in detail, rather than cataloguing the gift abstractly."
  - "CASE A, second person, present. 'The page settles into you, whole.' Not 'you might find you remember.'"
