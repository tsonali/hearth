[project]
name = "imagination-engine"
version = "0.1.0"
description = "Local-first guided imagination sessions. v0: future-self visualization."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "CC0-1.0" }
authors = [{ name = "Sonali Maitra" }]
# CORE deps only — the generation / fine-tune / eval path. This set resolves
# cleanly on a fresh `uv sync` (no conflicts), so the grind box and any
# contributor can install without the TTS dependency hell. TTS is an optional
# extra (see [project.optional-dependencies]) because chatterbox-tts pins
# diffusers==0.29.0 / torch==2.6.0, which conflict with our torch>=2.12 (MLX/F5).
dependencies = [
    "mlx-lm>=0.21.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.27.0",
]

[project.optional-dependencies]
# Voice/TTS layer — install with `uv sync --extra voice`. Kept OUT of core
# because of the chatterbox/diffusers/torch conflict; the generation+training
# path never imports these (Voice is lazy-imported only when rendering audio).
voice = [
    "kokoro-onnx>=0.5.0",
    "soundfile>=0.13.1",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "f5-tts>=1.1.20",
    "lameenc>=1.8.0",
]

[project.scripts]
imagination-engine = "imagination_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imagination_engine"]
