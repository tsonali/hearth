[project]
name = "imagination-engine"
version = "0.1.0"
description = "Local-first guided imagination sessions. v0: future-self visualization."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Sonali Maitra" }]
dependencies = [
    "mlx-lm>=0.21.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "kokoro-onnx>=0.5.0",
    "soundfile>=0.13.1",
]

[project.scripts]
imagination-engine = "imagination_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imagination_engine"]
