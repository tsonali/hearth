<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hearth — Companion</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Companion chat — built on the shared phosphor palette in style.css */
    .wrap { max-width: 720px; margin: 0 auto; padding: 28px var(--pad-x) 120px; }
    .frame-note { color: var(--text-dim); font-size: 0.95rem; line-height: 1.5;
      border: 1px solid var(--rule); padding: 12px 14px; margin: 14px 0 22px; }
    .frame-note strong { color: var(--amber); }
    #log { display: flex; flex-direction: column; gap: 16px; }
    .msg { line-height: 1.55; white-space: pre-wrap; }
    .you { color: var(--text-bright); }
    .you::before { content: "you  "; color: var(--text-dim); }
    .mirror { color: var(--text); }
    .mirror::before { content: ""; }
    .think { color: var(--text-dim); font-style: italic; }
    form { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
      border-top: 1px solid var(--rule); padding: 14px var(--pad-x);
      display: flex; gap: 10px; max-width: 720px; margin: 0 auto; }
    #box { flex: 1; background: var(--bg-alt); color: var(--text-bright);
      border: 1px solid var(--rule-bright); font-family: var(--font);
      font-size: 1.1rem; padding: 10px 12px; }
    #box:focus { outline: none; box-shadow: var(--glow-bright); }
    button { background: var(--bg); color: var(--text-bright);
      border: 1px solid var(--rule-bright); font-family: var(--font);
      font-size: 1.1rem; padding: 10px 18px; cursor: pointer; }
    button:hover { color: var(--amber); border-color: var(--amber); }
    .home { color: var(--text-dim); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="home" href="/">← Hearth</a>
    <h1>Companion</h1>
    <div class="frame-note">
      This is a <strong>mirror, not a person.</strong> It has no feelings and is not
      your friend. It reflects your own words back so you can hear yourself think.
      Nothing you type leaves this machine — it isn't saved anywhere you didn't choose,
      and it's sent nowhere. Type a thought to begin.
    </div>
    <div id="log"></div>
  </div>

  <form id="form" autocomplete="off">
    <input id="box" placeholder="what's on your mind…" autofocus>
    <button type="submit" id="send">send</button>
  </form>

  <script>
    const sessionId = "comp-" + Math.random().toString(36).slice(2);
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const box = document.getElementById("box");
    const send = document.getElementById("send");

    function add(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      log.appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = box.value.trim();
      if (!msg) return;
      box.value = ""; send.disabled = true;
      add(msg, "you");
      const thinking = add("…", "think");
      try {
        const r = await fetch("/companion/turn", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: msg }),
        });
        const data = await r.json();
        thinking.remove();
        add(data.reply || "(no reply)", "mirror");
      } catch (err) {
        thinking.remove();
        add("(couldn't reach the local engine — is the server running?)", "think");
      } finally {
        send.disabled = false; box.focus();
      }
    });
  </script>
</body>
</html>
