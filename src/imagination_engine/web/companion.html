<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hearth — Companion</title>
  <link rel="stylesheet" href="/static/hearth.css">
  <style>
    .narrow { padding-bottom: 130px; }
    form { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper);
      border-top: 2px solid var(--ink); padding: 14px var(--pad-x); display: flex;
      gap: 12px; max-width: 720px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="narrow">
    <a class="home" href="/">← Hearth</a>
    <p class="kicker">Companion</p>
    <hr class="rule">
    <div class="note">
      This is a <strong>mirror, not a person.</strong> It has no feelings and is not
      your friend. It reflects your own words back so you can hear yourself think.
      Nothing you type leaves this machine — it is saved nowhere you did not choose,
      and sent nowhere. Type a thought to begin.
    </div>
    <div id="log"></div>
  </div>

  <form id="form" autocomplete="off">
    <input type="text" id="box" placeholder="What's on your mind…" autofocus>
    <button type="submit" id="send">Send</button>
  </form>

  <script>
    const sessionId = "comp-" + Math.random().toString(36).slice(2);
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const box = document.getElementById("box");
    const send = document.getElementById("send");

    function add(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      log.appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = box.value.trim();
      if (!msg) return;
      box.value = ""; send.disabled = true;
      add(msg, "you");
      const thinking = add("…", "think");
      try {
        const r = await fetch("/companion/turn", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: msg }),
        });
        const data = await r.json();
        thinking.remove();
        add(data.reply || "(no reply)", "a");
      } catch (err) {
        thinking.remove();
        add("(couldn't reach the local engine — is the server running?)", "think");
      } finally {
        send.disabled = false; box.focus();
      }
    });
  </script>
</body>
</html>
