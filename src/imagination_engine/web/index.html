<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imagination Engine — local</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <h1>Imagination Engine</h1>
      <p class="subtitle">local · private · v0 foundation</p>
    </header>

    <section class="input">
      <label for="prompt">Type something. The model runs entirely on this machine.</label>
      <textarea id="prompt" rows="4" autofocus></textarea>
      <button id="go" type="button">Generate</button>
      <p class="hint">⌘/Ctrl + Enter to send</p>
    </section>

    <section class="output" aria-live="polite">
      <pre id="response"></pre>
      <div id="audio-controls" hidden>
        <button id="speak" type="button">▶ Read aloud</button>
        <span id="speak-status" class="hint"></span>
        <audio id="player" controls hidden></audio>
      </div>
    </section>
  </main>

  <script>
    const $prompt = document.getElementById("prompt");
    const $go = document.getElementById("go");
    const $response = document.getElementById("response");
    const $audioControls = document.getElementById("audio-controls");
    const $speak = document.getElementById("speak");
    const $speakStatus = document.getElementById("speak-status");
    const $player = document.getElementById("player");

    let lastResponseText = "";

    async function generate() {
      const prompt = $prompt.value.trim();
      if (!prompt) return;
      $go.disabled = true;
      $response.textContent = "";
      $audioControls.hidden = true;
      $player.hidden = true;
      $player.removeAttribute("src");
      lastResponseText = "";

      try {
        const res = await fetch("/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt }),
        });
        if (!res.ok || !res.body) {
          $response.textContent = `Error: ${res.status} ${res.statusText}`;
          return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          $response.textContent += chunk;
          lastResponseText += chunk;
        }
        if (lastResponseText.trim()) {
          $audioControls.hidden = false;
        }
      } catch (err) {
        $response.textContent = `Error: ${err.message}`;
      } finally {
        $go.disabled = false;
      }
    }

    async function speak() {
      if (!lastResponseText.trim()) return;
      $speak.disabled = true;
      $speakStatus.textContent = "rendering audio …";
      try {
        const res = await fetch("/speak", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: lastResponseText }),
        });
        if (!res.ok) {
          $speakStatus.textContent = `Error: ${res.status} ${res.statusText}`;
          return;
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        $player.src = url;
        $player.hidden = false;
        $speakStatus.textContent = "";
        await $player.play();
      } catch (err) {
        $speakStatus.textContent = `Error: ${err.message}`;
      } finally {
        $speak.disabled = false;
      }
    }

    $go.addEventListener("click", generate);
    $speak.addEventListener("click", speak);
    $prompt.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        generate();
      }
    });
  </script>
</body>
</html>
